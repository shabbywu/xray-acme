name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release
        on:
          release:
            types: [published]
          workflow_dispatch: {}
        permissions:
          contents: write
        jobs:
          build-and-upload:
            name: Build and upload release assets
            runs-on: ubuntu-latest
            strategy:
              matrix:
                include:
                  - goos: linux
                    goarch: amd64
                  - goos: windows
                    goarch: amd64
                  - goos: darwin
                    goarch: amd64
                  - goos: darwin
                    goarch: arm64
            steps:
              - name: Checkout
                uses: actions/checkout@v6

              - name: Set up Go
                uses: actions/setup-go@v6

              - name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
                env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 0
                run: |
                  set -e
                  mkdir -p dist
                  BIN_NAME=xray-acme
                  OUT=dist/${BIN_NAME}-${GOOS}-${GOARCH}
                  if [ "$GOOS" = "windows" ]; then OUT=${OUT}.exe; fi
                  GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED go build -ldflags "-s -w" -o "$OUT" ./...
                  zip -j "dist/${BIN_NAME}-${GOOS}-${GOARCH}.zip" "$OUT"

              - name: Upload asset to GitHub Release
                uses: actions/upload-release-asset@v1
                env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                  upload_url: ${{ github.event.release.upload_url }}
                  asset_path: dist/xray-acme-${{ matrix.goos }}-${{ matrix.goarch }}.zip
                  asset_name: xray-acme-${{ matrix.goos }}-${{ matrix.goarch }}.zip
                  asset_content_type: application/zip
              